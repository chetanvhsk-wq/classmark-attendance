name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install JS dependencies (also vendors jsPDF/SheetJS)
        run: npm ci

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==10.4.0

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Firebase Android OAuth
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "Missing GOOGLE_SERVICES_JSON repository secret"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          cp google-services.json android/app/google-services.json

      - name: Apply native patches (widget, permissions, icon)
        run: python scripts/patch_android.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Use the repository's stable debug keystore
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon

      - name: Verify APK signing certificate
        run: |
          mkdir -p "$RUNNER_TEMP/apk-certificate"
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk META-INF/CERT.RSA > "$RUNNER_TEMP/apk-certificate/CERT.RSA"
          openssl pkcs7 -inform DER -in "$RUNNER_TEMP/apk-certificate/CERT.RSA" -print_certs -out "$RUNNER_TEMP/apk-certificate/certificate.pem"
          expected="$(keytool -list -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{gsub(/:/, "", $2); print toupper($2); exit}')"
          actual="$(openssl x509 -in "$RUNNER_TEMP/apk-certificate/certificate.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$expected" && test "$expected" = "$actual" || { echo "APK signing certificate does not match keystore/debug.keystore"; exit 1; }

      - name: Name APK classmark.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/classmark.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: attendance-apk
          path: android/app/build/outputs/apk/debug/classmark.apk
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Classmark ${{ github.ref_name }} — Stable Release
          body: |
            ## Stable Release

            Classmark Android release build for `${{ github.ref_name }}`.

            ### Highlights
            - More reliable browser and Android class reminders, including tap-to-Home navigation.
            - Restored and verified Class Mark app branding across web and Android icons.
            - APK is attached as `classmark.apk`.

            See [the updates log](https://github.com/chetanvhsk-wq/classmark-attendance/blob/main/problems%20and%20updates/updates.md) for details.
          files: |
            android/app/build/outputs/apk/debug/classmark.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
